<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Set your password · LibSys</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="theme.js"></script>
  <link rel="stylesheet" href="theme.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.95.3"></script>
</head>
<body class="min-h-[100dvh]">
  <main class="mx-auto flex min-h-[100dvh] w-full max-w-[320px] flex-col justify-center px-4 py-12">
    <span class="flex h-8 w-8 items-center justify-center rounded-md bg-ink text-sm font-semibold text-white" aria-hidden="true">L</span>
    <h1 id="title" class="mt-5 text-[26px] font-bold leading-tight tracking-[-0.01em]">Set your password</h1>
    <p id="intro" class="mt-1 text-muted">Checking your link…</p>

    <form id="password-form" class="mt-7 hidden space-y-3" novalidate>
      <div>
        <label for="password" class="mb-1 block text-[13px] text-muted">New password</label>
        <input
          type="password"
          id="password"
          autocomplete="new-password"
          class="w-full rounded-md border border-line-strong bg-[rgba(242,241,238,0.6)] px-2.5 py-1.5 text-ink outline-none focus:border-accent focus:bg-surface"
        />
        <p class="mt-1 text-xs text-muted">At least 8 characters.</p>
      </div>
      <div>
        <label for="confirm" class="mb-1 block text-[13px] text-muted">Type it again</label>
        <input
          type="password"
          id="confirm"
          autocomplete="new-password"
          class="w-full rounded-md border border-line-strong bg-[rgba(242,241,238,0.6)] px-2.5 py-1.5 text-ink outline-none focus:border-accent focus:bg-surface"
        />
      </div>

      <p id="error" role="alert" class="hidden rounded bg-danger-tint px-3 py-2 text-sm"></p>

      <button
        type="submit"
        id="save-btn"
        class="w-full rounded-md bg-accent px-3 py-2 font-medium text-white hover:bg-accent-hover disabled:opacity-60"
      >
        Save password
      </button>
    </form>

    <p id="done" role="status" class="mt-7 hidden rounded bg-accent-tint px-3 py-2 text-sm">
      Password saved. Opening Support chat…
    </p>

    <div id="no-session" class="mt-7 hidden space-y-3 text-sm">
      <p id="no-session-reason" role="alert" class="rounded bg-danger-tint px-3 py-2"></p>
      <p class="text-muted">If you were invited, ask your LibSys admin to send a new invite. If you forgot your password, request a new reset link from the sign-in page.</p>
      <a href="login.html" class="inline-block font-medium text-accent hover:underline">Go to sign in</a>
    </div>

    <p class="mt-10 text-xs text-muted">{{council}}</p>
  </main>

  <script>
    // Handles invite links, password reset links, and changing your password
    // while signed in. Supabase puts the link's sign-in details in the URL
    // fragment; the client reads them and starts a session.
    const supabaseClient = window.supabase.createClient(
      "{{supabaseUrl}}",
      "{{supabaseKey}}"
    );

    const hash = new URLSearchParams(location.hash.slice(1));
    const linkType = hash.get("type");
    const linkError = hash.get("error_description") || hash.get("error");

    const show = (id) => document.getElementById(id).classList.remove("hidden");
    const form = document.getElementById("password-form");
    const errorBox = document.getElementById("error");
    const saveBtn = document.getElementById("save-btn");

    function showError(message) {
      errorBox.textContent = message;
      errorBox.classList.toggle("hidden", !message);
    }

    function noSession(reason) {
      document.getElementById("title").textContent = "This link doesn't work";
      document.getElementById("intro").textContent = "";
      document.getElementById("no-session-reason").textContent = reason;
      show("no-session");
    }

    async function start() {
      if (linkError) {
        noSession(/expired|invalid/i.test(linkError)
          ? "This link has expired or has already been used."
          : "This link couldn't be used.");
        return;
      }

      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) {
        noSession("This link has expired or has already been used.");
        return;
      }

      // Drop the sign-in details from the address bar once they've been used.
      if (location.hash) history.replaceState(null, "", location.pathname);

      const email = session.user?.email ?? "your account";
      document.getElementById("title").textContent = linkType === "invite" ? "Welcome to LibSys" : "Set your password";
      document.getElementById("intro").textContent =
        linkType === "invite" ? `Choose a password for ${email}.` : `Choose a new password for ${email}.`;
      show("password-form");
      document.getElementById("password").focus();
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const password = document.getElementById("password").value;
      const confirm = document.getElementById("confirm").value;

      if (password.length < 8) {
        showError("Use at least 8 characters.");
        return;
      }
      if (password !== confirm) {
        showError("The two passwords don't match.");
        return;
      }

      showError("");
      saveBtn.disabled = true;
      saveBtn.textContent = "Saving…";

      const { error } = await supabaseClient.auth.updateUser({ password });
      if (error) {
        showError(/same/i.test(error.message)
          ? "That's your current password. Choose a different one."
          : error.message);
        saveBtn.disabled = false;
        saveBtn.textContent = "Save password";
        return;
      }

      form.classList.add("hidden");
      show("done");
      setTimeout(() => { window.location.href = "index.html"; }, 1500);
    });

    start();
  </script>
</body>
</html>
